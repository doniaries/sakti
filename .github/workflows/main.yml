name: 🚀 Deploy Website
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "lang/**"
      - "public/**"
      - "resources/**"
      - "routes/**"
      - "composer.json"
      - "composer.lock"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/main.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, bcmath, curl
          coverage: none

      - name: ⚡ Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: 📦 Install Composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev --no-scripts

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: 🏗️ Build assets
        run: npm run build

      - name: 🧹 Sanitize & Validate FTP Host
        id: ftp_prep
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          if [ -z "$RAW_SERVER" ]; then
            echo "::error::Secret FTP_SERVER belum diset di GitHub Repository Secrets!"
            exit 1
          fi

          # Hapus protokol seperti ftp://, ftps://, https://, http:// serta trailing slash dan spasi
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|/.*$||' | tr -d '[:space:]')
          
          echo "target_server=$CLEAN_SERVER" >> "$GITHUB_OUTPUT"
          echo "FTP Target Host disiapkan secara aman dari secrets."

      - name: 🚀 Sync via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_prep.outputs.target_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          security: loose
          timeout: 300000
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          state-name: sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/.agents/**
            **/.claude/**
            **/.antigravity/**
            **/.env*
            **/*.sql
            **/*.sqlite*
            **/*.md
            README.md
            **/node_modules/**
            vendor/**
            **/tests/**
            **/lhksource/**
            storage/logs/**
            storage/framework/cache/**
            storage/framework/sessions/**
            storage/framework/views/**
            storage/app/public/**
            *.py
            match.php
            modify_users.php
            update_seeder.php
            load-test.js
            phpunit.xml
            .phpunit.result.cache
            .editorconfig
            .gitattributes
            .gitignore
            skills-lock.json
            package.json
            package-lock.json
            vite.config.js
